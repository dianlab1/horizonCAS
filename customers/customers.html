<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#102b37">
    <title>Customers</title>
    <link rel="stylesheet" href="customers.css">
</head>

<body>

    <div class="customer-list">
        <div class="content">
            <div class="header">
                <img class="arrow-left" src="arrow-left0.svg" />
                <div class="heading">
                    <div class="title">Customer List</div>
                    <div class="subtitle">84 customers · 6 with active jobs</div>
                </div>
                <img class="bell" src="bell0.svg" />
            </div>
            <div class="directory">
                <div class="search">
                    <img class="search2" src="search1.svg" />
                    <input class="placeholder" type="text" placeholder="Search customer or contact">
                    <img class="sliders-horizontal" src="sliders-horizontal0.svg" />
                </div>
                <div class="customer-results"></div>
            </div>
        </div>
        <div class="bottom-navigation">
            <div class="navigation-item">
                <img class="home" src="home0.svg" />
                <div class="label3">Home</div>
            </div>
            <div class="navigation-item">
                <img class="clipboard" src="clipboard0.svg" />
                <div class="label3">Jobs</div>
            </div>
            <div class="navigation-item">
                <img class="boxes" src="boxes0.svg" />
                <div class="label3">Stock</div>
            </div>
            <div class="navigation-item">
                <img class="menu" src="menu0.svg" />
                <div class="label4">More</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="customers.js"></script>
    <script src="../pwa.js"></script>
</body>

</html>
