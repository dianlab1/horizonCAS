<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#102b37">
    <title>Machines</title>
    <link rel="stylesheet" href="machines.css">
</head>

<body>

    <div class="machine-list">
        <div class="content">
            <div class="header">
                <img class="arrow-left" src="../icons/left-arrow.png" />
                <div class="heading">
                    <div class="title">Machine List</div>
                    <div class="subtitle">126 assets across 18 sites</div>
                </div>
                <button class="add-machine">+ Add Machine</button>
                <img class="bell" src="../icons/bell.png" />
            </div>
            <div class="machine-inventory">
                <div class="search">
                    <!-- <img class="search2" src="search1.svg" /> -->
                    <input class="placeholder" type="text" placeholder="Search Machines">
                    <!-- <img class="sliders-horizontal" src="sliders-horizontal0.svg" /> -->
                </div>
                <div class="machines-results"></div>
            </div>
        </div>
        <div class="bottom-navigation">
            <div class="navigation-item">
                <img class="home" src="home0.svg" />
                <div class="label4">Home</div>
            </div>
            <div class="navigation-item">
                <img class="clipboard" src="clipboard0.svg" />
                <div class="label4">Jobs</div>
            </div>
            <div class="navigation-item">
                <img class="boxes" src="boxes0.svg" />
                <div class="label4">Stock</div>
            </div>
            <div class="navigation-item">
                <img class="menu" src="menu0.svg" />
                <div class="label5">More</div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="machines.js"></script>
    <script src="../pwa.js"></script>
</body>

</html>
