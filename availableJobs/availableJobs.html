<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#102b37">
    <title>availableJobs</title>
    <link rel="stylesheet" href="availableJobs.css">
</head>

<body>

    <div class="available-jobs">
        <div class="content">
            <div class="header">
                <img class="arrow-left" src="../icons/left-arrow.png" />
                <div class="heading">
                    <div class="title">Available Jobs</div>
                    <div class="subtitle">5 open jobs near your site</div>
                </div>
                <img class="bell" src="bell0.svg" />
            </div>
            <div class="open-jobs">

                <input class="search" type="text" placeholder="Search available jobs...">

                <div class="job-results"></div>

            </div>
            <!-- The Modal Element -->
            <dialog id="details-modal">
                <div class="modal-header">
                    <button type="button" id="closeModalBtn" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="job-details"></div>
                    <div class="modal-controls">
                        <div class="timer-panel">
                            <div class="timer-label">Time on job</div>
                            <div id="job-timer">00:00:00</div>
                        </div>
                        <div class="action-buttons">
                            <button type="button" class="startJobBtn">Start Job</button>
                            <button type="button" class="stopJobBtn">Stop Job</button>
                        </div>
                    </div>
                </div>
            </dialog>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="availableJobs.js"></script>
    <script src="../pwa.js"></script>
</body>

</html>
